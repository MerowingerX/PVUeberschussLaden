services:
  pvueb:
    build:
      context: .
      network: host
      # Werte kommen aus der Umgebung — `make up` füllt sie aus Git. Ein
      # blankes `docker compose up --build` läuft weiter, dann steht auf der
      # Info-Seite eben „unbekannt".
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_DESCRIBE: ${GIT_DESCRIBE:-}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: pvueb
    env_file: .env            # PVUEB_INVERTER_IP=<ip-des-sdongle>
    volumes:
      # Die .env zusätzlich einbinden: env_file reicht die Werte nur herein,
      # die Datei selbst bliebe auf dem Host. Erst so kann der Dienst sie beim
      # Start vervollständigen und im Web-UI geänderte Werte dauerhaft sichern.
      - ./.env:/app/.env
      # Mitschnitt für Testfälle (PVUEB_RECORD_DIR=/data/recordings), sonst
      # wäre er nach dem nächsten "docker compose up --build" verloren.
      - ./recordings:/data/recordings
    ports:
      # ACHTUNG: beides bindet auf 0.0.0.0, also auf jede Schnittstelle des
      # Hosts. Ohne PVUEB_WEB_USER / PVUEB_OCPP_USER kennen beide Dienste keine
      # Anmeldung — wer sie erreicht, steuert die Wallbox und lädt die
      # Hausbatterie aus dem Netz.
      #
      # In einem Netz, dem du nicht vollständig traust, die LAN-Adresse
      # voranstellen ("192.168.x.y:8080:8080"). Eine ufw-Regel genügt dafür
      # nicht: Docker legt eigene iptables-Ketten an und umgeht sie.
      - "9000:9000"           # OCPP (Wallbox -> Server)
      - "8080:8080"           # Web-UI
    networks:
      - default
      # Meldeweg nach draußen: myhome-messenger hängt im selben Netz und ist
      # darüber als http://myhome-messenger:8090/notify erreichbar. Der
      # Umweg über ein gemeinsames Netz statt über 127.0.0.1 ist keine
      # Bequemlichkeit — der Host-Loopback ist aus einem Container heraus
      # nicht erreichbar, und den Messenger stattdessen ins LAN zu hängen
      # verbietet sich: er kennt keine Anmeldung.
      # Anlegen mit: docker network create myhome
      - myhome
    restart: unless-stopped

networks:
  default:
  myhome:
    external: true
    name: myhome
